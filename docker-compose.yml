version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: lasa_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=lasa_db
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: lasa_redis
    ports:
      - "6379:6379"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: lasa_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: lasa_kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lasa_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/lasa_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP=kafka:29092
      - JWT_SECRET=lasa_super_secret_jwt_key_2026
      - BERT_MODEL=emilyalsentzer/Bio_ClinicalBERT
      - RISK_THRESHOLD=0.7
      - CACHE_TTL=3600
    volumes:
      - ./models_saved:/app/models_saved
      - ./data:/app/data
    depends_on:
      - mongodb
      - redis
      - kafka
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lasa_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
